[project]
name = "village-guard-backend"
version = "1.0.0"
description = "Backend API for the license-plate recognition (YOLO + OCR) village security system"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database (async)
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    # Settings / config
    "pydantic-settings>=2.5.2",
    # Auth
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    # Real-time notification (SSE)
    "sse-starlette>=2.1.3",
    # File upload support (multipart/form-data from AI vision service)
    "python-multipart>=0.0.9",
    # Email (verify / reset password links)
    "aiosmtplib>=3.0.2",
    "email-validator>=2.0.0",
    "pillow>=10.4.0",
    "tzdata>=2024.1",
    # Outbound HTTP calls (MediaMTX API, AI vision service)
    "httpx>=0.27.2",
    # Camera integrations & Security
    "onvif_zeep>=0.2.12",
    "yarl>=1.9.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]