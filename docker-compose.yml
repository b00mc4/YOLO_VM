version: '3.8'

services:

  db:
    image: postgres:15
    container_name: village_guard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d YOLO_PROJECT"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - village_net

  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: village_guard_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: Asia/Bangkok
    volumes:
      - ./storage:/app/storage
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
    networks:
      - village_net

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: village_guard_mediamtx
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MTX_AUTHINTERNALUSERS_0_USER: ${MEDIAMTX_USER}
      MTX_AUTHINTERNALUSERS_0_PASS: ${MEDIAMTX_PASS}
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: api
    ports:
      - "8554:8554"
      - "8888:8888"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - village_net

  nginx:
    image: nginx:alpine
    container_name: village_guard_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    networks:
      - village_net

volumes:
  pgdata:

networks:
  village_net:
    driver: bridge
