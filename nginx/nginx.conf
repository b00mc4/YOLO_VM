server_tokens off;

gzip on;
gzip_types text/plain application/json application/javascript text/xml text/javascript;
gzip_min_length 1000;

map $http_x_forwarded_proto $real_scheme {
    default $scheme;
    https   https;
    http    http;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream fastapi_backend {
    server api:8000;
}

upstream mediamtx_backend {
    server mediamtx:8888;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://192.168.100.97:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /api/sse/ {
        proxy_pass http://fastapi_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://fastapi_backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /docs {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }
    
    location /openapi.json {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }

    location /mediamtx/ {
        proxy_pass http://mediamtx_backend/;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_hide_header WWW-Authenticate;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        
        proxy_redirect / $real_scheme://$http_host/mediamtx/;
        proxy_redirect / /mediamtx/;
        
        proxy_cookie_path / /mediamtx/;
    }
}
